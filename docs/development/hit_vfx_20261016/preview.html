<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>코어 가디언 타격 시안 3종</title><style>body{margin:0;padding:24px;background:#171c21;color:#e7e5de;font:15px system-ui}main{max-width:900px;margin:auto}h1{font-size:24px}h2{font-size:18px}p{color:#b8c1c6;line-height:1.7}section{padding:18px;background:#23292f;border:1px solid #414b51;border-radius:10px;margin:20px 0}img{display:block;width:100%;height:auto;image-rendering:pixelated}summary{padding:12px 0;color:#a4d2ca;cursor:pointer}</style><main><h1>타격 VFX · 공격별 시안 3종</h1><p>좌→우: 공격형 / 수비형 / 버프형 · 모두 같은 도트 3배<br>소리 없음 · 게임 미적용 · 시안용 숫자와 타이밍</p><section><h2>기술병 · 금속 타격</h2><img src="01_engineer.gif" alt="기술병 · 금속 타격 단발 명중 시안"><details><summary>집중 공격 시각 검사</summary><img src="01_engineer_dense.gif" alt="집중 공격 표현"></details></section><section><h2>단일 포탑 · 방향성 수정 타격</h2><img src="02_single.gif" alt="단일 포탑 · 방향성 수정 타격 단발 명중 시안"><details><summary>집중 공격 시각 검사</summary><img src="02_single_dense.gif" alt="집중 공격 표현"></details></section><section><h2>범위 포탑 · 소형 수정 파편</h2><img src="03_multi.gif" alt="범위 포탑 · 소형 수정 파편 단발 명중 시안"><details><summary>집중 공격 시각 검사</summary><img src="03_multi_dense.gif" alt="집중 공격 표현"></details></section><p>집중 공격은 대상당 45ms 간격 20회 입력을 사용한 시각 검사입니다. 명중 효과는 100ms 간격으로 제한하고 숫자는 일부를 묶어 표시한 제안입니다. 실제 게임 피해 판정·공격속도·밸런스 결과가 아닙니다.</p></main></html>
