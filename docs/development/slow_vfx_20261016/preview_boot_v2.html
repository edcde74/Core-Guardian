const names=['공격형','수비형','버프형'];const imgs=files.map(src=>{const im=new Image();im.src='data:image/png;base64,'+src;return im});
// Side-view boot and downward arrow. Exact integer pixels, no font glyph.
const glyph=['111110000','122210000','123310000','123310000','133310000','133311100','133332210','133333310','111111110','044444440'];
const arrow=['00100','00100','00100','10101','01110','00100'];
const groups=[];let scale=4,anim=false,start=0,raf=0;
function rect(ctx,x,y,w,h,color,a=1){ctx.globalAlpha=a;ctx.fillStyle=color;ctx.fillRect(x,y,w,h);ctx.globalAlpha=1}
function mark(ctx,x,y,t){
 const fade=t<.16?Math.max(.25,t/.16):t>1.25?Math.max(0,1-(t-1.25)/.25):1;
 if(fade<=0)return;
 const colors=['','#15282c','#a7c2b5','#567f76','#344c48'];
 for(let yy=0;yy<glyph.length;yy++)for(let xx=0;xx<glyph[yy].length;xx++){const v=Number(glyph[yy][xx]);if(v)rect(ctx,x+xx,y+yy,1,1,colors[v],fade)}
 // The arrow descends two source pixels once on application, then stays still.
 const ay=y+2-(t<.24?2-Math.min(2,Math.floor(t/.08)):0);
 for(let yy=0;yy<arrow.length;yy++)for(let xx=0;xx<5;xx++)if(arrow[yy][xx]==='1'){rect(ctx,x+10+xx,ay+yy,3,1,colors[1],fade);rect(ctx,x+11+xx,ay+yy-1,1,3,colors[1],fade)}
 for(let yy=0;yy<arrow.length;yy++)for(let xx=0;xx<5;xx++)if(arrow[yy][xx]==='1')rect(ctx,x+11+xx,ay+yy,1,1,colors[2],fade);
}
for(const slowed of [false,true])for(let i=0;i<3;i++){const f=document.createElement('figure'),c=document.createElement('canvas'),caption=document.createElement('figcaption');c.width=72;c.height=112;c.setAttribute('aria-label',names[i]+(slowed?' 둔화 상태':' 원본'));caption.textContent=names[i];f.append(c,caption);document.getElementById(slowed?'slow':'normal').append(f);f.hidden=i!==0;groups.push({c,i,slowed})}
function draw(t){for(const {c,i,slowed} of groups){c.style.width=(72*scale)+'px';c.style.height=(112*scale)+'px';const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,72,112);rect(ctx,0,0,72,112,'#23292f');rect(ctx,10,103,52,1,'#48535a');ctx.drawImage(imgs[i],Math.floor((72-imgs[i].width)/2),102-imgs[i].height);if(slowed)mark(ctx,51,54,t)}document.getElementById('phase').textContent=t<.24?'적용':t<=1.25?'유지':t<1.5?'해제':'해제 완료'}
function frame(now){const t=(now-start)/1000;draw(t);if(t<1.8&&anim)raf=requestAnimationFrame(frame);else{anim=false;document.getElementById('play').disabled=false}}
document.getElementById('play').onclick=()=>{cancelAnimationFrame(raf);anim=true;start=performance.now();document.getElementById('play').disabled=true;raf=requestAnimationFrame(frame)};
document.getElementById('hold').onclick=()=>{cancelAnimationFrame(raf);anim=false;document.getElementById('play').disabled=false;draw(.7)};
document.getElementById('unit').onchange=e=>{for(const g of groups)g.c.parentElement.hidden=g.i!==Number(e.target.value)};document.getElementById('scale').onchange=e=>{scale=Number(e.target.value);draw(.7)};
Promise.all(imgs.map(im=>im.decode())).then(()=>{draw(.7);for(const [label,t] of [['적용',.07],['유지',.7],['해제',1.37],['종료',1.6]]){const f=document.createElement('figure'),c=document.createElement('canvas'),cap=document.createElement('figcaption');c.width=25;c.height=25;c.style.width='100px';c.style.height='100px';mark(c.getContext('2d'),4,8,t);cap.textContent=label;f.append(c,cap);document.getElementById('strip').append(f)}document.documentElement.dataset.ready='true'}).catch(e=>{document.getElementById('phase').textContent='원본 로딩 실패: '+e.message});
